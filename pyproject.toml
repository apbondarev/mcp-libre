[project]
name = "mcp-libre"
version = "0.1.0"
description = "LibreOffice Model Context Protocol Server - Provides tools and resources for interacting with LibreOffice documents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "LibreOffice MCP Server Project"},
]
keywords = ["mcp", "libreoffice", "document", "processing", "ai", "assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
# The server is a LibreOffice extension under plugin/pythonpath/, running on
# LibreOffice's own Python with nothing but the standard library. There is no
# installable package here and no runtime dependency; what follows exists to
# give the tests a virtualenv.
dependencies = []

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=7.0.0",
]
